# Desarrollo con recarga en caliente (Vite + nodemon) y el código montado.
#   docker compose -f docker-compose.dev.yml up
# Para producción usa docker-compose.yml.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # root para instalar dependencias en el volumen node_modules (la imagen corre como node)
    user: root
    # Solo accesible desde esta máquina: el navegador usa /api a través de Vite
    ports:
      - "127.0.0.1:2122:3000"
    env_file:
      - ./backend/.env
    environment:
      - DATA_DIR=/data
      - NODE_ENV=development
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      # Base de datos y logs persistentes, fuera del código
      - ./data:/data
      # Catálogo único de emociones compartido con el frontend
      - ./shared:/shared:ro
    command: sh -lc "npm install && npm run dev"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: build
    ports:
      - "3031:5173"
    environment:
      - VITE_API_URL=http://backend:3000/api
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - ./shared:/shared:ro
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_node_modules:
  frontend_node_modules:
